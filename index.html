<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rainbow Fruit Catch 🍓</title>
<meta name="author" content="Engr Muhammad Shabir">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#8ec9ff;
    --sky-bottom:#ffe6a7;
    --panel:#ffffff;
    --ink:#3a2e5c;
    --accent:#ff6f91;
    --accent2:#4dd0e1;
    --good:#4caf50;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:'Baloo 2', 'Comic Sans MS', system-ui, sans-serif;
    touch-action:none;
    user-select:none;
    -webkit-user-select:none;
  }
  body{
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
    display:flex; align-items:center; justify-content:center;
  }
  #game-wrap{
    position:relative;
    width:100vw; height:100vh;
    max-width:520px;
    max-height:100vh;
    margin:0 auto;
    overflow:hidden;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
  }
  /* clouds */
  .cloud{
    position:absolute; top:0; opacity:0.9; pointer-events:none;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,0.05));
    animation:drift linear infinite;
  }
  .cloud svg{width:100%; height:100%; display:block;}
  @keyframes drift{
    from{transform:translateX(-120px);}
    to{transform:translateX(110vw);}
  }

  /* HUD */
  #hud{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding: max(12px, env(safe-area-inset-top)) 16px 0 16px;
    z-index:10;
  }
  .pill{
    background:rgba(255,255,255,0.85);
    border-radius:999px;
    padding:8px 16px;
    font-weight:800;
    font-size:18px;
    color:var(--ink);
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    display:flex; align-items:center; gap:6px;
  }
  #hearts span{ filter: drop-shadow(0 1px 1px rgba(0,0,0,0.15)); }

  /* basket */
  #basket{
    position:absolute;
    bottom: max(30px, env(safe-area-inset-bottom));
    width:90px; height:70px;
    transform:translateX(-50%);
    left:50%;
    font-size:60px;
    text-align:center;
    line-height:70px;
    z-index:5;
    filter:drop-shadow(0 6px 6px rgba(0,0,0,0.2));
    transition:filter 0.1s;
  }

  .falling{
    position:absolute;
    font-size:42px;
    top:-60px;
    z-index:4;
    filter:drop-shadow(0 4px 4px rgba(0,0,0,0.15));
    will-change:transform;
  }

  /* pop effect */
  .pop{
    position:absolute;
    font-weight:800;
    font-size:26px;
    color:var(--good);
    z-index:6;
    animation:popUp 0.7s ease-out forwards;
    pointer-events:none;
  }
  @keyframes popUp{
    0%{transform:translateY(0) scale(0.6); opacity:1;}
    60%{transform:translateY(-30px) scale(1.2); opacity:1;}
    100%{transform:translateY(-55px) scale(1); opacity:0;}
  }

  /* overlays */
  .overlay{
    position:absolute; inset:0;
    background:rgba(58,46,92,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:20;
    backdrop-filter: blur(2px);
  }
  .card{
    background:var(--panel);
    border-radius:28px;
    padding:32px 28px;
    text-align:center;
    width:min(85%, 360px);
    box-shadow:0 14px 30px rgba(0,0,0,0.25);
  }
  .card h1{
    margin:0 0 6px 0;
    font-size:32px;
    color:var(--ink);
    font-weight:800;
  }
  .card p{
    margin:6px 0 20px 0;
    color:#6b5f8f;
    font-size:16px;
    font-weight:500;
  }
  .big-emoji{font-size:64px; margin-bottom:6px;}
  .btn{
    border:none;
    font-family:inherit;
    font-weight:800;
    font-size:20px;
    color:#fff;
    background:linear-gradient(135deg, var(--accent), #ff9a6c);
    padding:14px 36px;
    border-radius:999px;
    cursor:pointer;
    box-shadow:0 8px 0 #c94f6d, 0 10px 16px rgba(0,0,0,0.2);
    transition:transform 0.08s, box-shadow 0.08s;
  }
  .btn:active{
    transform:translateY(6px);
    box-shadow:0 2px 0 #c94f6d, 0 4px 8px rgba(0,0,0,0.2);
  }
  .btn.secondary{
    background:linear-gradient(135deg, var(--accent2), #7ee8e0);
    box-shadow:0 8px 0 #2f9ba3, 0 10px 16px rgba(0,0,0,0.2);
  }
  .btn.secondary:active{ box-shadow:0 2px 0 #2f9ba3, 0 4px 8px rgba(0,0,0,0.2); }

  #score-final{ font-size:22px; font-weight:800; color:var(--accent); margin:4px 0 18px 0;}

  #ground{
    position:absolute; left:0; right:0; bottom:0; height:14px;
    background:repeating-linear-gradient(90deg, #7bc47f 0 18px, #6bb56f 18px 36px);
    z-index:3;
  }

  .hint{
    position:absolute; bottom:6px; left:0; right:0;
    text-align:center; font-size:12px; color:#5c517d; opacity:0.75;
    z-index:6; font-weight:600;
  }

  #credit-badge{
    position:absolute;
    top: max(12px, env(safe-area-inset-top));
    left:50%;
    transform:translateX(-50%);
    background:rgba(255,255,255,0.7);
    color:#5c517d;
    font-size:11px;
    font-weight:700;
    padding:4px 12px;
    border-radius:999px;
    z-index:9;
    letter-spacing:0.2px;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
    pointer-events:none;
  }
</style>
</head>
<body>
<div id="game-wrap">

  <div id="hud">
    <div class="pill">⭐ <span id="score">0</span></div>
    <div class="pill" id="hearts">❤️❤️❤️</div>
  </div>

  <div id="ground"></div>
  <div id="basket">🧺</div>
  <div class="hint" id="hint">Drag left / right or use ← → keys</div>
  <div id="credit-badge">By Engr Muhammad Shabir</div>

  <div class="overlay" id="start-screen">
    <div class="card">
      <div class="big-emoji">🍎🍇🍌</div>
      <h1>Rainbow Fruit Catch</h1>
      <p>Move the basket and catch the falling fruit.<br>Don't miss too many!</p>
      <button class="btn" id="start-btn">Play ▶</button>
      <div style="margin-top:14px; font-size:12px; color:#9b90bd; font-weight:600;">Created by Engr Muhammad Shabir</div>
    </div>
  </div>

  <div class="overlay" id="gameover-screen" style="display:none;">
    <div class="card">
      <div class="big-emoji">🏆</div>
      <h1>Game Over</h1>
      <div id="score-final">Score: 0</div>
      <button class="btn secondary" id="retry-btn">Play Again 🔁</button>
    </div>
  </div>

</div>

<script>
(function(){
  const wrap = document.getElementById('game-wrap');
  const basket = document.getElementById('basket');
  const scoreEl = document.getElementById('score');
  const heartsEl = document.getElementById('hearts');
  const startScreen = document.getElementById('start-screen');
  const gameoverScreen = document.getElementById('gameover-screen');
  const startBtn = document.getElementById('start-btn');
  const retryBtn = document.getElementById('retry-btn');
  const scoreFinal = document.getElementById('score-final');
  const hint = document.getElementById('hint');

  const FRUITS = ['🍎','🍇','🍌','🍓','🍊','🍑','🍍','🥝'];
  const BAD = '💣';

  let score = 0;
  let lives = 3;
  let running = false;
  let items = [];
  let spawnTimer = 0;
  let lastTime = 0;
  let spawnInterval = 1000; // ms
  let fallSpeed = 140; // px per second
  let basketX = 0; // center x in px
  let wrapRect = { w: 0, h: 0 };
  let dragging = false;

  function updateRect(){
    const r = wrap.getBoundingClientRect();
    wrapRect.w = r.width;
    wrapRect.h = r.height;
    if (basketX === 0) basketX = wrapRect.w / 2;
  }
  updateRect();
  window.addEventListener('resize', updateRect);

  function audioCtxFactory(){
    let ctx;
    return function(){
      if (!ctx) {
        try { ctx = new (window.AudioContext || window.webkitAudioContext)(); }
        catch(e){ return null; }
      }
      return ctx;
    };
  }
  const getCtx = audioCtxFactory();

  function beep(freq, dur, type){
    const ctx = getCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  }
  function sfxCatch(){ beep(660, 0.15, 'triangle'); }
  function sfxMiss(){ beep(160, 0.25, 'sawtooth'); }
  function sfxOver(){ beep(220, 0.4, 'square'); setTimeout(()=>beep(140,0.5,'square'), 150); }

  function setBasketX(x){
    const half = 45;
    basketX = Math.max(half, Math.min(wrapRect.w - half, x));
    basket.style.left = basketX + 'px';
  }
  setBasketX(wrapRect.w/2);

  // input: drag / mouse / touch
  function pointerX(e){
    if (e.touches && e.touches.length) return e.touches[0].clientX - wrap.getBoundingClientRect().left;
    return e.clientX - wrap.getBoundingClientRect().left;
  }
  wrap.addEventListener('pointerdown', (e)=>{ dragging = true; setBasketX(pointerX(e)); hint.style.display='none'; });
  wrap.addEventListener('pointermove', (e)=>{ if (dragging) setBasketX(pointerX(e)); });
  window.addEventListener('pointerup', ()=>{ dragging = false; });

  // keyboard
  let keys = {};
  window.addEventListener('keydown', (e)=>{
    keys[e.key] = true;
    if (['ArrowLeft','ArrowRight'].includes(e.key)) hint.style.display='none';
  });
  window.addEventListener('keyup', (e)=>{ keys[e.key] = false; });

  function spawnItem(){
    const isBad = Math.random() < 0.14;
    const el = document.createElement('div');
    el.className = 'falling';
    el.textContent = isBad ? BAD : FRUITS[Math.floor(Math.random()*FRUITS.length)];
    const x = 20 + Math.random() * (wrapRect.w - 40);
    el.style.left = x + 'px';
    wrap.appendChild(el);
    items.push({ el, x, y: -60, bad: isBad, speed: fallSpeed + Math.random()*60 });
  }

  function popText(x, y, text, color){
    const p = document.createElement('div');
    p.className = 'pop';
    p.textContent = text;
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    if (color) p.style.color = color;
    wrap.appendChild(p);
    setTimeout(()=> p.remove(), 700);
  }

  function updateHearts(){
    heartsEl.innerHTML = '❤️'.repeat(Math.max(lives,0)) + '🖤'.repeat(Math.max(3-lives,0));
  }

  function loseLife(){
    lives -= 1;
    updateHearts();
    sfxMiss();
    if (lives <= 0) endGame();
  }

  function endGame(){
    running = false;
    sfxOver();
    scoreFinal.textContent = 'Score: ' + score;
    gameoverScreen.style.display = 'flex';
    items.forEach(it => it.el.remove());
    items = [];
  }

  function resetGame(){
    score = 0; lives = 3; spawnInterval = 1000; fallSpeed = 140;
    scoreEl.textContent = score;
    updateHearts();
    items.forEach(it => it.el.remove());
    items = [];
    spawnTimer = 0;
    gameoverScreen.style.display = 'none';
    startScreen.style.display = 'none';
    running = true;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function loop(now){
    if (!running) return;
    const dt = Math.min(50, now - lastTime); // ms, clamp
    lastTime = now;

    // keyboard movement
    const moveSpeed = 320 * (dt/1000);
    if (keys['ArrowLeft']) setBasketX(basketX - moveSpeed);
    if (keys['ArrowRight']) setBasketX(basketX + moveSpeed);

    // spawn
    spawnTimer += dt;
    if (spawnTimer >= spawnInterval){
      spawnTimer = 0;
      spawnItem();
    }

    const basketTop = wrapRect.h - 30 - 65; // approx basket top
    const basketBottom = wrapRect.h - 30;

    for (let i = items.length - 1; i >= 0; i--){
      const it = items[i];
      it.y += it.speed * (dt/1000);
      it.el.style.transform = 'translateY(' + it.y + 'px)';

      // collision check near basket zone
      if (it.y + 40 >= basketTop && it.y <= basketBottom){
        if (Math.abs(it.x - basketX) < 48){
          if (it.bad){
            loseLife();
            popText(it.x, basketTop-10, '-1', '#e5484d');
          } else {
            score += 10;
            scoreEl.textContent = score;
            sfxCatch();
            popText(it.x, basketTop-10, '+10', '#4caf50');
          }
          it.el.remove();
          items.splice(i,1);
          continue;
        }
      }

      // off screen (missed)
      if (it.y > wrapRect.h + 20){
        if (!it.bad) loseLife();
        it.el.remove();
        items.splice(i,1);
      }
    }

    // difficulty ramp
    if (score > 0 && score % 100 === 0){
      spawnInterval = Math.max(420, 1000 - score);
      fallSpeed = 140 + score * 0.6;
    }

    if (running) requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', resetGame);
  retryBtn.addEventListener('click', resetGame);

  // decorative clouds
  function makeCloud(top, dur, scale, delay){
    const c = document.createElement('div');
    c.className = 'cloud';
    c.style.top = top + 'px';
    c.style.width = (110*scale) + 'px';
    c.style.height = (60*scale) + 'px';
    c.style.animationDuration = dur + 's';
    c.style.animationDelay = delay + 's';
    c.innerHTML = '<svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg"><ellipse cx="30" cy="40" rx="28" ry="18" fill="white"/><ellipse cx="55" cy="28" rx="22" ry="20" fill="white"/><ellipse cx="75" cy="40" rx="24" ry="16" fill="white"/></svg>';
    wrap.appendChild(c);
  }
  makeCloud(30, 26, 1, 0);
  makeCloud(80, 34, 0.7, 4);
  makeCloud(140, 30, 0.85, 10);

  updateHearts();
})();
</script>
</body>
</html>
